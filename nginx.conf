server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие ответов
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Входная точка SPA — перепроверять при каждом запросе,
    # иначе пользователь получит ссылки на устаревший JS
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Служебные файлы PWA — не кэшировать, чтобы браузер замечал обновления
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Хэшированная статика Vite — неизменяемая, кэшируем навсегда
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Всё остальное — отдаём index.html (SPA-fallback для маршрутов React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
